name: ${COMPOSE_PROJECT_NAME:-tallerflow}

services:
  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
    restart: unless-stopped
