name: ${COMPOSE_PROJECT_NAME:-tallerflow}

services:
  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped

  backend:
    environment:
      TF_SMTP_HOST: mailpit
      TF_SMTP_PORT: "1025"
      TF_SMTP_USER: ""
      TF_SMTP_PASSWORD: ""
      TF_SMTP_REQUIRE_TLS: "false"
    depends_on:
      mailpit:
        condition: service_started
