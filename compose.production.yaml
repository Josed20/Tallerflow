services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set a production PostgreSQL password}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set a production owner password}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set a production Flyway password}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set a production application password}
      DB_BOOTSTRAP_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:?set a production bootstrap password}
      DB_CONSOLE_PASSWORD: ${DB_CONSOLE_PASSWORD:?set a production console database password}
    ports: !reset []
    restart: always

  backend:
    environment:
      TF_DATABASE_URL: ${TF_DATABASE_URL:?set the application database URL}
      TF_SESSION_PEPPER: ${TF_SESSION_PEPPER:?set a random session pepper}
      TF_ALLOWED_ORIGIN: ${TF_ALLOWED_ORIGIN:?set the public HTTPS origin}
      TF_MOBILE_ORIGINS: ${TF_MOBILE_ORIGINS:-https://localhost,capacitor://localhost}
      TF_PUBLIC_BASE_URL: ${TF_PUBLIC_BASE_URL:?set the public HTTPS base URL}
      TF_SIGNUP_ENABLED: ${TF_SIGNUP_ENABLED:-true}
      TF_CONSOLE_ORIGIN: ${TF_CONSOLE_ORIGIN:?set the console HTTPS origin}
      TF_CONSOLE_DATABASE_URL: ${TF_CONSOLE_DATABASE_URL:?set the console database URL}
      TF_CONSOLE_TOTP_KEY: ${TF_CONSOLE_TOTP_KEY:?set a random console TOTP key}
      TF_TRUSTED_PROXIES: ${TF_TRUSTED_PROXIES:-172.16.0.0/12}
      TF_PASSWORD_RESET_BASE_URL: ${TF_PASSWORD_RESET_BASE_URL:?set the public HTTPS password reset URL}
      TF_SMTP_HOST: ${TF_SMTP_HOST:?set the production SMTP host}
      TF_SMTP_PORT: ${TF_SMTP_PORT:-587}
      TF_SMTP_USER: ${TF_SMTP_USER:?set the production SMTP user}
      TF_SMTP_PASSWORD: ${TF_SMTP_PASSWORD:?set the production SMTP password}
      TF_SMTP_FROM: ${TF_SMTP_FROM:?set the verified SMTP sender}
      TF_SMTP_REQUIRE_TLS: "true"
      TF_R2_ENDPOINT: ${TF_R2_ENDPOINT:-}
      TF_R2_BUCKET_PHOTOS: ${TF_R2_BUCKET_PHOTOS:-}
      TF_R2_ACCESS_KEY_ID: ${TF_R2_ACCESS_KEY_ID:-}
      TF_R2_SECRET_ACCESS_KEY: ${TF_R2_SECRET_ACCESS_KEY:-}
      TF_ENVIRONMENT: production
    restart: always

  frontend:
    restart: always

  gateway:
    restart: always

  bootstrap:
    environment:
      TF_BOOTSTRAP_DATABASE_URL: ${TF_BOOTSTRAP_DATABASE_URL:?set the bootstrap database URL}
