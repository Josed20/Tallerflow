name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start database and run migrations
        run: docker compose up --wait postgres flyway
      - name: Validate migrations
        run: docker compose run --rm flyway validate
      - name: Test constraints
        run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U tallerflow_bootstrap -d "$POSTGRES_DB" < database/tests/constraints.sql
        env:
          POSTGRES_SUPERUSER: postgres
          POSTGRES_DB: tallerflow
      - name: Test identity contract and bootstrap privileges
        run: docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U tallerflow_bootstrap -d "$POSTGRES_DB" < database/tests/identity_contract.sql
        env:
          POSTGRES_SUPERUSER: postgres
          POSTGRES_DB: tallerflow
      - name: Test tenant isolation
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U tallerflow_bootstrap -d "$POSTGRES_DB" < database/tests/rls_setup.sql
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U tallerflow_app -d "$POSTGRES_DB" < database/tests/rls.sql
        env:
          POSTGRES_SUPERUSER: postgres
          POSTGRES_DB: tallerflow
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: ${{ hashFiles('backend/go.mod') != '' }}
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test backend
        if: ${{ hashFiles('backend/go.mod') != '' }}
        working-directory: backend
        run: go test ./...
      - name: Build backend image
        if: ${{ hashFiles('backend/go.mod') != '' }}
        run: docker build -t tallerflow-backend:test backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm test -- --run
      - name: Build frontend
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm run build
      - name: Build frontend image
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: docker build -t tallerflow-frontend:test frontend
