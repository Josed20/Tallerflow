name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: https://tallerflow.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit
      - name: Build web assets and sync Android
        run: npm --prefix frontend run android:sync
      - name: Compile debug APK
        working-directory: frontend/android
        run: bash ./gradlew assembleDebug --no-daemon

  sprint-2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit
      - name: Install Playwright Chromium
        run: npm --prefix frontend exec playwright install --with-deps chromium
      - name: Verify Sprint 2 from empty isolated volumes
        run: ./scripts/verify-sprint2.sh
      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sprint2-compose-logs
          path: |
            sprint1-compose.log
            sprint2-compose.log
          if-no-files-found: ignore
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
