server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = / { try_files /index.html =404; }
    location ~ ^/(onboarding|login|forgot-password|reset-password|join|app|app/clients|app/orders|app/orders/new|app/team)$ { try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
