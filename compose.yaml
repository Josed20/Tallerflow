name: ${COMPOSE_PROJECT_NAME:-tallerflow}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tallerflow}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-local-postgres-change-me}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-local-owner-change-me}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-local-migrator-change-me}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-local-app-change-me}
      DB_BOOTSTRAP_PASSWORD: ${DB_BOOTSTRAP_PASSWORD:-local-bootstrap-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  flyway:
    image: flyway/flyway:13.7.0
    command: -connectRetries=30 -validateMigrationNaming=true migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tallerflow}
      FLYWAY_USER: tallerflow_migrator
      FLYWAY_PASSWORD: ${DB_MIGRATION_PASSWORD:-local-migrator-change-me}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./database/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      TF_DATABASE_URL: ${TF_DATABASE_URL:-postgres://tallerflow_app:local-app-change-me@postgres:5432/tallerflow?sslmode=disable}
      TF_BOOTSTRAP_DATABASE_URL: ${TF_BOOTSTRAP_DATABASE_URL:-postgres://tallerflow_bootstrap:local-bootstrap-change-me@postgres:5432/tallerflow?sslmode=disable}
      TF_HTTP_ADDRESS: ":8080"
      TF_ENVIRONMENT: ${TF_ENVIRONMENT:-development}
      TF_SESSION_PEPPER: ${TF_SESSION_PEPPER:-local-session-pepper-change-me}
      TF_ALLOWED_ORIGIN: ${TF_ALLOWED_ORIGIN:-http://localhost:8080}
      TF_TRUSTED_PROXIES: ${TF_TRUSTED_PROXIES:-172.16.0.0/12}
    depends_on:
      flyway:
        condition: service_completed_successfully
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  bootstrap:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["/bootstrap"]
    environment:
      TF_BOOTSTRAP_DATABASE_URL: ${TF_BOOTSTRAP_DATABASE_URL:-postgres://tallerflow_bootstrap:local-bootstrap-change-me@postgres:5432/tallerflow?sslmode=disable}
    depends_on:
      flyway:
        condition: service_completed_successfully
    stdin_open: true
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    restart: unless-stopped

  gateway:
    profiles: ["app"]
    image: caddy:2.10.2-alpine
    ports:
      - "${BACKEND_PORT:-8080}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /config
      - /data
    restart: unless-stopped

volumes:
  postgres-data:
